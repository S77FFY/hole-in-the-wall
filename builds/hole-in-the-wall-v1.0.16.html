  for (const it of S.wallet) {

    if (!groups[k]) { groups[k] = { key: k, items: [] }; ng.push(groups[k]); }

  }
  const rank = g => { const n = g.items[0]; return n.era ? -1000 + n.denom : (n.half ? n.denom / 2 : n.denom * 10); };
  ng.sort((a, b) => rank(b) - rank(a));
  for (const g of ng) g.items.sort((a, b) => (b.msg ? 1 : 0) - (a.msg ? 1 : 0));
  out.push(...ng);
  for (const it of S.wallet) if (it.kind === 'coin') out.push({ key: 'k' + it.id, items: [it] });
  for (const it of S.wallet) if (it.kind === 'paper') out.push({ key: 'p' + it.id, items: [it] });

}

}

function calibHit(s, lane) {

    yield btn('R1'); yield ['wait', 'balance']; yield btn('R3'); yield ['wait', 'menu'];

  yield ['sel', PRED.note('n500')]; yield ['act', 'tear'];
  yield btn('R2'); yield ['wait', 'deposit']; yield ['depall']; yield ['sel', PRED.note('n500h')]; yield ['tap', RECT.deposit]; yield key('ENTER');
  yield ['wait', 'pong']; yield ['pong']; yield ['wait', 'pongend']; yield btn('R3'); yield ['wait', 'hiscore']; yield btn('R3'); yield ['wait', 'goldaward']; yield ['collect'];
  yield ['sel', PRED.card('gold')]; yield ['tap', RECT.cardSlot]; yield ['wait', 'pin'];
  for (const k of '1967') yield key(k); yield key('ENTER'); yield ['wait', 'menu'];
  yield btn('L3'); yield ['wait', 'more']; yield btn('L0'); yield ['wait', 'topup'];
  for (const k of PHONE) yield key(k); yield key('ENTER'); yield ['wait', 'topupamt']; yield btn('L0'); yield ['wait', 'topupsent']; yield ['sms']; yield ['collect'];
  // Act III

  yield key('1'); yield ['wait', 'selftest']; yield ['simon']; yield ['wait', 'service'];
  yield key('2'); yield ['wait', 'cassettes']; yield key('4'); yield ['wait', 'cass4'];
  for (const k of '1987') yield key(k); yield key('ENTER'); yield ['wait', 'msg']; yield key('ENTER'); yield ['wait', 'calib']; yield ['calib'];
  yield ['wait', 'msg']; yield key('ENTER'); yield ['wait', 'cassettes']; yield key('0'); yield ['wait', 'service'];
  yield ['tap', RECT.bin];

  yield ['sel', PRED.note('n50e1967')]; yield ['tap', RECT.deposit]; yield ['wait', 'dep67']; yield ['waitfn', () => S.out.receipt && T - S.out.receiptT > 1.05, 'receipt']; yield ['tap', RECT.receipt];

let HUMAN = { tap: 0, read: 0 };

    }

    else if (k === 'depall') { for (const d of ['n5000', 'n2000', 'n1000']) { while (tiles().some(t => t.key === d)) { selTile(PRED.note(d)); tc(RECT.deposit); sim(HUMAN.tap); } } }
    else if (k === 'dec71') {
      waitFor(() => { if (SCR.name !== 'dec71' || SCR.done) return true; const d = SCREENS.dec71.dot(SCR); if (Math.abs(d.x - SLOT71.x) <= 2) { tc(KEYR.ENTER); sim(200); } return false; }, 'dec71', 60000);

}
